{% extends 'base.html' %}
{% block title %}Группы и клиенты{% endblock %}
{% block content %}
<div class="card"><h2>Список групп с количеством клиентов на {{ today|date:"d.m.Y" }}</h2>
<table><tr><th>Группа</th><th>Зал</th><th>Клиентов</th></tr>
{% for g in groups %}<tr><td>{{ g }}</td><td>{{ g.hall }}</td><td>{{ g.clients }}</td></tr>
{% empty %}<tr><td colspan="3">Групп нет.</td></tr>{% endfor %}</table></div>
{% endblock %}
