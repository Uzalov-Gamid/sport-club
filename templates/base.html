<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Спортивный клуб{% endblock %}</title>
  <style>
    body{font-family:system-ui,sans-serif;margin:0;background:#f4f6f9;color:#1f2937}
    header{background:#14532d;color:#fff;padding:10px 24px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
    header a{color:#fff;text-decoration:none}header .sp{flex:1}
    main{max-width:1000px;margin:24px auto;padding:0 16px}
    .card{background:#fff;border-radius:8px;padding:16px 20px;margin-bottom:16px;box-shadow:0 1px 3px #0002}
    table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px;border-bottom:1px solid #e5e7eb}
    input,select,textarea{padding:6px;margin:2px 0;max-width:100%}
    button,.btn{background:#14532d;color:#fff;border:0;padding:8px 14px;border-radius:6px;cursor:pointer;text-decoration:none;display:inline-block;font-size:14px}
    .btn.red{background:#b91c1c}.btn.gray{background:#6b7280}
    .msg{padding:8px 12px;border-radius:6px;margin-bottom:8px;background:#d1fae5}.msg.error{background:#fee2e2}
    .errorlist{color:#b91c1c;list-style:none;padding:0;margin:0}
    .tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
    .tiles a{background:#fff;padding:16px;border-radius:8px;text-decoration:none;color:inherit;box-shadow:0 1px 3px #0002;font-weight:600}
    @media print{header,.noprint{display:none}body{background:#fff}.card{box-shadow:none}}
  </style>
</head>
<body>
<header>
  <a href="{% url 'club:home' %}"><b>Спортивный клуб</b></a>
  {% if user.is_authenticated %}
    <span class="sp"></span><span>{{ user.username }}</span>
    <form method="post" action="{% url 'logout' %}">{% csrf_token %}<button>Выйти</button></form>
  {% endif %}
</header>
<main>
  {% for m in messages %}<div class="msg {{ m.tags }}">{{ m }}</div>{% endfor %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
